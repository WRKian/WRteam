<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WR团队</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:100vw; height:100vh;
  background: radial-gradient(circle at center, #0b1220 0%, #05070d 100%);
  overflow:hidden; display:flex; align-items:center; justify-content:center;
  font-family: Arial, "Helvetica Neue", sans-serif;
}
.scene { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.logo {
  position:absolute; top:50%; left:50%; width:320px;
  transform-origin:center center;
  transform: translate(-260px,-220px) rotate(-10deg);
  opacity:0; will-change:transform,opacity; z-index:3;
}
.logo img { display:block; width:100%; height:auto; pointer-events:none; }
.meteor-trail {
  position:absolute; top:50%; left:50%; width:280px; height:14px;
  background: linear-gradient(90deg, rgba(35,208,216,0) 0%, rgba(35,208,216,0.35) 40%, rgba(35,208,216,0.9) 100%);
  filter: blur(6px);
  transform: translate(-260px,-220px) rotate(-10deg); opacity:0; z-index:2;
}
.pulse-ring {
  position:absolute; top:50%; left:50%; width:360px; height:360px; border-radius:50%;
  border:2px solid rgba(35,208,216,0.6);
  transform: translate(-50%,-50%) scale(0.5); opacity:0; z-index:1;
}
.info-text {
  position:absolute; top:calc(50% + 210px); left:50%;
  transform: translateX(-50%) translateY(20px);
  color:#86e9ee; font-size:22px; letter-spacing:4px; opacity:0; z-index:4; white-space:nowrap;
}
.hint-text {
  position:absolute; top:calc(50% + 252px); left:50%;
  transform: translateX(-50%) translateY(20px);
  color:#557086; font-size:14px; letter-spacing:2px; opacity:0; z-index:4; white-space:nowrap;
}
@keyframes meteorFly {
  0% { opacity:0; transform: translate(-260px,-220px) rotate(-10deg); }
  15% { opacity:1; }
  70% { opacity:1; transform: translate(10px,5px) rotate(2deg); }
  100% { opacity:1; transform: translate(0,0) rotate(0deg); }
}
@keyframes trailMove {
  0% { opacity:0; transform: translate(-260px,-220px) rotate(-10deg); }
  60% { opacity:1; }
  100% { opacity:0; transform: translate(0,0) rotate(0deg); }
}
@keyframes pulse {
  0% { opacity:0; transform: translate(-50%,-50%) scale(0.5); }
  30% { opacity:0.8; }
  100% { opacity:0; transform: translate(-50%,-50%) scale(1.35); }
}
@keyframes textIn {
  from { opacity:0; transform: translateX(-50%) translateY(20px); }
  to { opacity:1; transform: translateX(-50%) translateY(0); }
}
.logo { animation: meteorFly 2.4s cubic-bezier(0.22,1,0.36,1) forwards; }
.meteor-trail { animation: trailMove 2.4s cubic-bezier(0.22,1,0.36,1) forwards; }
.pulse-ring { animation: pulse 1.4s ease-out 2.4s forwards; }
.info-text { animation: textIn 1s ease-out 3.4s forwards; }
.hint-text { animation: textIn 1s ease-out 3.8s forwards; text-decoration:none; }
.text-ji{
  border-color:aqua;
  border-radius:50px 20px;
}
</style>
</head>
